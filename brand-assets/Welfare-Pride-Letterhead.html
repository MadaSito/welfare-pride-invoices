<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Welfare Pride Letterhead</title>
  <style>
    @font-face { font-family: Roboto; src: url("../client/public/brand/fonts/Roboto-Regular.ttf"); font-weight: 400; }
    @font-face { font-family: Roboto; src: url("../client/public/brand/fonts/Roboto-Bold.ttf"); font-weight: 700; }
    @page { size: Letter; margin: 0.62in; }
    * { box-sizing: border-box; }
    body { margin: 0; color: #000; font-family: Roboto, Arial, sans-serif; }
    .band { height: 9px; margin: -0.62in -0.62in 30px; background: #5A92C9; }
    header { display: flex; align-items: flex-start; justify-content: space-between; border-bottom: 1px solid #bed6e8; padding-bottom: 22px; }
    header img { width: 240px; max-height: 88px; object-fit: contain; object-position: left center; }
    header p { margin: 2px 0; color: #5e7082; font-size: 10px; line-height: 1.55; text-align: right; }
    main { padding-top: 34px; min-height: 7.5in; font-size: 11pt; line-height: 1.6; }
    footer { display: flex; justify-content: space-between; border-top: 1px solid #bed6e8; padding-top: 12px; color: #5e7082; font-size: 9px; }
  </style>
</head>
<body>
  <div class="band"></div>
  <header>
    <img src="welfare-pride-logo-light.png" alt="Welfare Pride" />
    <p>www.welfarepride.org<br />[Organization address]<br />[Contact email] · [Phone]</p>
  </header>
  <main>
    <p>[Date]</p>
    <p>[Recipient name]<br />[Recipient organization]<br />[Address]</p>
    <p>[Letter content]</p>
  </main>
  <footer><span>Welfare Pride</span><span>Building care, connection, and accountability.</span></footer>
</body>
</html>
